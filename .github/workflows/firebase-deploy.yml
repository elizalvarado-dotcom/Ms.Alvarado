name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - claude/financial-literacy-bilingual-pc1ksq

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      # One-time provisioning: create the Money Matters Hosting site if it
      # doesn't exist yet. Safe to leave in permanently — it's a no-op once
      # the site exists.
      - run: npx firebase-tools@15 hosting:sites:create alvarado-money-matters --project solving-systems-activities --non-interactive || true

      # Hosting-only: Money Matters no longer uses Firestore, and the
      # service account currently lacks the IAM permissions needed to
      # deploy Firestore rules. Re-add ",firestore:rules" here once that's
      # sorted out and the Algebra World app's rules need CI deploys too.
      - run: npx firebase-tools@15 deploy --only hosting --project solving-systems-activities --non-interactive

      # Temporary diagnostic: confirm what's actually being served at each
      # URL right now, from a real internet vantage point (this sandbox's
      # own network can't reach either URL directly). Safe to remove later.
      - name: Verify live content
        run: |
          echo "── solving-systems-activities.web.app ──"
          curl -s -D - -o /tmp/algebra.html "https://solving-systems-activities.web.app/?cachebust=$(date +%s)" | head -20
          echo "--- title/heading grep ---"
          grep -o '<title>[^<]*</title>' /tmp/algebra.html || true
          grep -o "Algebra 1 · [0-9–-]*" /tmp/algebra.html || true
          echo
          echo "── alvarado-money-matters.web.app ──"
          curl -s -D - -o /tmp/moneymatters.html "https://alvarado-money-matters.web.app/?cachebust=$(date +%s)" | head -20
          echo "--- title/heading grep ---"
          grep -o '<title>[^<]*</title>' /tmp/moneymatters.html || true
