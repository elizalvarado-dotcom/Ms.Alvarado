name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - claude/financial-literacy-bilingual-pc1ksq

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      # One-time provisioning: create the Money Matters Hosting site if it
      # doesn't exist yet. Safe to leave in permanently — it's a no-op once
      # the site exists.
      - run: npx firebase-tools@15 hosting:sites:create alvarado-money-matters --project solving-systems-activities --non-interactive || true

      - run: npx firebase-tools@15 deploy --only hosting,firestore:rules --project solving-systems-activities --non-interactive
