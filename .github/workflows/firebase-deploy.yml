name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - claude/financial-literacy-bilingual-pc1ksq

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - run: npx firebase-tools@15 deploy --only hosting,firestore:rules --project solving-systems-activities --non-interactive
